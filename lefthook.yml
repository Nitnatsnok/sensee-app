pre-commit:
  commands:
    repository-guards:
      run: ./.githooks/pre-commit
    graphify:
      # Rebuild the committed knowledge graph from the staged changes and stage
      # it, so the graph in this commit matches the code. AST-only, incremental,
      # never blocks. The graph is tracked, so checkout/merge need no hook — it
      # travels with the branch. Opt out with GRAPHIFY_SKIP=1.
      run: ./.githooks/graphify-rebuild

pre-push:
  commands:
    verification:
      run: ./.githooks/pre-push
    # Primary secret-leak defense: scan before the push reaches a public remote.
    # The GitHub Actions workflow is reactive (commits are public by then) —
    # this is the one place that can still prevent a leak.
    secrets:
      run: gitleaks detect --redact --no-banner
