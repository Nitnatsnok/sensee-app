#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

#Gradle
# Project-level baseline sized for a 16 GB dev machine alongside the IDE. CI and
# individual developers raise -Xmx via the environment (GRADLE_OPTS / a
# ~/.gradle/gradle.properties) rather than forcing a large heap on everyone.
# ParallelGC favours batch build throughput; the heap dump aids diagnosing OOM
# regressions under parallel + multi-target KMP compilation.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Surfaces configuration-cache problems in the report for observability without
# failing the build. Cannot be `fail`: AGP's `JdkImageInput`
# (:androidApp:compileDebugJavaWithJavac) is not configuration-cache
# serializable — a known upstream AGP limitation we cannot fix. Revisit (raise
# to `fail`) once AGP makes that bean cc-compatible.
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#App
# Single source of truth for the application version across Android and Desktop.
# iOS mirrors `sensee.version` manually in apps/iosApp/Configuration/Config.xcconfig.
sensee.version=0.3.0
sensee.versionCode=3
