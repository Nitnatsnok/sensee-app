# Project-scoped Codex configuration. Codex loads this file only for trusted
# projects. Project-scoped MCP cwd values are resolved from the repository root.

[mcp_servers.graphify]
command = "uv"
args = ["run", "--with", "graphifyy[mcp]", "python", "-m", "graphify.serve", "graphify-out/graph.json"]
cwd = "."
startup_timeout_sec = 30

[mcp_servers.likec4]
command = "npx"
args = ["-y", "@likec4/mcp"]
cwd = "docs/c4"
startup_timeout_sec = 30
