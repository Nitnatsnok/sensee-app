[versions]
# Build & Android SDK
agp = "9.2.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

# Kotlin & KotlinX
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-collections-immutable = "0.4.0"
kotlinx-datetime = "0.8.0"

# AndroidX
androidx-activity = "1.13.0"
androidx-splashscreen = "1.2.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.10.0"
androidx-test-ext = "1.3.0"

# Firebase
google-services = "4.4.4"
firebase-bom = "34.13.0"
firebase-crashlytics = "3.0.7"

# Compose
compose-multiplatform = "1.11.0"
compose-multiplatform-adaptive = "1.3.0-beta01"
compose-unstyled = "2.3.0"

# Networking
ktor = "3.5.0"

# Persistence
sqldelight = "2.3.2"

# Dependency injection
metro-di = "1.1.1"

# Navigation
decompose = "3.5.0"

# Observability
kermit = "2.1.0"

# Audio
mp3spi = "1.9.5.4"

# Secure storage (desktop JVM)
java-keyring = "1.0.4"

# Native interop (desktop JVM, Windows-only custom window chrome)
jna = "5.18.1"

# Testing
# JUnit 5 ecosystem version; consumers pull it via the junit-bom platform so
# jupiter and platform-launcher never drift apart.
junit5 = "6.0.3"

# Quality & build tooling
# detekt 2.x is pre-release; pinned to alpha for the Compose-rules ruleset that
# targets the detekt 2 API. Revisit when detekt 2.0 reaches stable.
detekt-gradle-plugin = "2.0.0-alpha.3"
detekt-compose-rules = "0.5.9"
detekt-faire-rules = "0.5.7"
ktlint-gradle = "14.2.0"
ktlint-engine = "1.7.1"
dependency-analysis = "3.13.0"
konsist = "0.17.3"
ben-manes-versions = "0.54.0"
version-catalog-update = "1.1.0"

[libraries]
# Versionless: the version is supplied by the junit-bom platform so jupiter and
# platform-launcher stay in lockstep automatically.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Kotlin
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# Kotlin Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Android
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# Ktor Client
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# SQLDelight
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-webWorker = { module = "app.cash.sqldelight:web-worker-driver", version.ref = "sqldelight" }
sqldelight-extensions-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# Metro DI
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro-di" }

# Decompose
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensions-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }

# Observability
logging-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Audio
audio-mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "mp3spi" }

# Secure storage (desktop JVM): wraps Windows Credential Vault, macOS Keychain,
# and Linux libsecret behind a single Java API.
java-keyring = { module = "com.github.javakeyring:java-keyring", version.ref = "java-keyring" }

# JNA (desktop JVM): Win32 calls for the custom undecorated-window chrome that
# keeps native minimize/maximize animations. -jpms variants ship a module-info.
jna = { module = "net.java.dev.jna:jna-jpms", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform-jpms", version.ref = "jna" }

# Compose
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-multiplatform-adaptive" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-uiTest-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose-multiplatform" }
# Compose Unstyled — modular artifacts, one per component.
compose-unstyled-primitives = { module = "com.composables:composeunstyled-primitives", version.ref = "compose-unstyled" }
compose-unstyled-theming = { module = "com.composables:composeunstyled-theming", version.ref = "compose-unstyled" }
compose-unstyled-platformTheme = { module = "com.composables:composeunstyled-platformtheme", version.ref = "compose-unstyled" }
compose-unstyled-button = { module = "com.composables:composeunstyled-button", version.ref = "compose-unstyled" }
compose-unstyled-coloredIndication = { module = "com.composables:composeunstyled-colored-indication", version.ref = "compose-unstyled" }
compose-unstyled-icon = { module = "com.composables:composeunstyled-icon", version.ref = "compose-unstyled" }
compose-unstyled-textField = { module = "com.composables:composeunstyled-text-field", version.ref = "compose-unstyled" }
compose-unstyled-modalBottomSheet = { module = "com.composables:composeunstyled-modal-bottom-sheet", version.ref = "compose-unstyled" }

# Quality
quality-detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt-gradle-plugin" }
quality-detekt-kotlin-analysis-api = { module = "dev.detekt:detekt-kotlin-analysis-api", version.ref = "detekt-gradle-plugin" }
quality-detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt-gradle-plugin" }
quality-detekt-test-utils = { module = "dev.detekt:detekt-test-utils", version.ref = "detekt-gradle-plugin" }
quality-konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "detekt-compose-rules" }
detekt-faire = { module = "com.faire:faire-detekt-rules", version.ref = "detekt-faire-rules" }

# Gradle plugin classpath — consumed only by the gradle-plugins included build,
# kept here so each tool version lives in a single catalog.
gradle-plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-plugin-kotlin-multiplatform = { group = "org.jetbrains.kotlin.multiplatform", name = "org.jetbrains.kotlin.multiplatform.gradle.plugin", version.ref = "kotlin" }
gradle-plugin-kotlin-multiplatform-androidLibrary = { group = "com.android.kotlin.multiplatform.library", name = "com.android.kotlin.multiplatform.library.gradle.plugin", version.ref = "agp" }
gradle-plugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
gradle-plugin-compose-compiler = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
gradle-plugin-android = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
gradle-plugin-android-lint = { group = "com.android.lint", name = "com.android.lint.gradle.plugin", version.ref = "agp" }
gradle-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt-gradle-plugin" }
gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-dependencyAnalysis = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependency-analysis" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLint = { id = "com.android.lint", version.ref = "agp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro-di" }
dependencyAnalysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
benManesVersions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics" }

# Convention
sensee-composeMultiplatform = { id = "app.sensee.gradle.compose-multiplatform" }
sensee-kmpLibrary = { id = "app.sensee.gradle.kmp-library" }
sensee-quality = { id = "app.sensee.gradle.quality" }
sensee-kmpWebToolchain = { id = "app.sensee.gradle.kmp-web-toolchain" }
